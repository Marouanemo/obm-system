# ============================================================
# OBM SYSTEM — obm-system.com
# Canonical: apex (obm-system.com)
# ============================================================

# Formulaires : limite de débit de /api/lead
limit_req_zone $binary_remote_addr zone=leads:10m rate=6r/m;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name obm-system.com www.obm-system.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://obm-system.com$request_uri; }
}

# www -> apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.obm-system.com;
    ssl_certificate     /etc/letsencrypt/live/www.obm-system.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.obm-system.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://obm-system.com$request_uri;
}

# Main HTTPS apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name obm-system.com;

    root /var/www/obm-system/public;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/www.obm-system.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.obm-system.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/webotic-securite.conf;

    # Encodage des fichiers texte (llms.txt, robots.txt, humans.txt, flux RSS, manifest)
    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript application/manifest+json application/rss+xml;

    # URL en double : /index.html et doubles barres obliques -> URL propre
    if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") { return 301 $1$2; }
    if ($request_uri ~ "^([^?]*?)//+(.*)$") { return 301 $1/$2; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml font/woff font/woff2 application/manifest+json;

    # ---- Admin backoffice (Node.js on :3201) ----
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    # ---- Static assets with long cache ----
    location ~* \.(?:css|js|woff2?|svg|jpg|jpeg|png|webp|avif|ico|gif|mp4)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/webotic-securite.conf;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/snippets/webotic-securite.conf;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # CSP en observation 48 h (cahier, étape 1.7), puis passer en Content-Security-Policy
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://assets.calendly.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://formsubmit.co; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://assets.calendly.com; font-src 'self'; frame-src https://calendly.com; form-action 'self' https://formsubmit.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }

    # Formulaires : la clé LeadFlow reste côté serveur (le navigateur appelle /api/lead)
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=leads burst=3 nodelay;
        if ($http_origin !~* ^https://obm-system\.com$) { return 403; }
        include /etc/nginx/secrets/leadflow.conf;   # une seule ligne : set $leadflow_key "CLE_LEADFLOW";
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $leadflow_upstream https://leadflow-production-d68a.up.railway.app/web-leads;
        proxy_set_header x-api-key $leadflow_key;
        proxy_set_header Host leadflow-production-d68a.up.railway.app;
        proxy_ssl_server_name on;
        proxy_pass $leadflow_upstream;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # ---- Anciennes pages (positionnement dentaire) ----
    location ~ ^/blog/meta-ads-cabinets-dentaires-erreurs/?$     { return 301 /blog/erreurs-meta-ads/; }
    location ~ ^/blog/whatsapp-automation-cabinets-dentaires/?$  { return 301 /blog/relances-whatsapp-guide/; }
    location ~ ^/cas-clients/cabinet-(facettes-rabat|implants-casablanca)/?$ { return 410; }

    # Répertoires de travail : jamais servis
    location ~ ^/(docs|deploy)(/|$) { return 404; }

    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    error_page 404 410 /404.html;

    access_log /var/log/nginx/obm-system.access.log;
    error_log  /var/log/nginx/obm-system.error.log;
}
